<!DOCTYPE html>
<html lang="en-ZA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Sparkle Car Wash to ask questions or arrange vehicle collection and delivery.">
    <title>Sparkle Car Wash | Contact Us</title>
</head>
<body>

    <header>
        <h1>Contact Sparkle Car Wash</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="prices.html">Prices</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Get in Touch</h2>

        <p>
            Complete the form below to contact us about our
            car wash services.
        </p>

        <form action="#" method="get">

            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>

            <br><br>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>

            <br><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone">

            <br><br>

            <fieldset>
                <legend>Collection or delivery?</legend>

                <input type="radio" id="collection" name="service" value="collection">
                <label for="collection">Collection</label>

                <input type="radio" id="delivery" name="service" value="delivery">
                <label for="delivery">Delivery</label>
            </fieldset>

            <br>

            <label for="message">Your Message:</label>
            <br>
            <textarea id="message" name="message" rows="5" cols="30"></textarea>

            <br><br>

            <button type="submit">Send Message</button>

        </form>

        <h2>Opening Hours</h2>

<p>Monday - Friday: <time>08:00</time> - <time>17:00</time></p>
<p>Saturday: <time>08:00</time> - <time>15:00</time></p>
<p>Sunday: Closed</p>
    </main>

    <footer>
        <p>&copy; 2026 Sparkle Car Wash. All rights reserved.</p>
    </footer>

</body>
</html>
