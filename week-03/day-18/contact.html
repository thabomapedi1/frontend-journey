
<!DOCTYPE html>
<html lang="en-ZA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Ubuntu Tech Solutions</title>
    <meta name="description" content="Contact Ubuntu Tech Solutions for computer repairs and IT support.">
</head>
<body>
    <header>
        <h1>Ubuntu Tech Solutions</h1>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Contact Us</h2>
        <p>Complete the form below and we will get back to you.</p>

        <form action="#" method="post">
            <div>
                <label for="full-name">Full name (required)</label>
                <input
                    type="text"
                    id="full-name"
                    name="full-name"
                    autocomplete="name"
                    required
                >
            </div>

            <div>
                <label for="email">Email address (required)</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                >
            </div>

            <div>
                <label for="phone">Phone number</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    autocomplete="tel"
                    aria-describedby="phone-hint"
                >
                <p id="phone-hint">Use numbers only.</p>
            </div>

            <fieldset>
                <legend>Collection or delivery?</legend>

                <input type="radio" id="collection" name="service" value="collection">
                <label for="collection">Collection</label>

                <input type="radio" id="delivery" name="service" value="delivery">
                <label for="delivery">Delivery</label>
            </fieldset>

            <div>
                <label for="message">Your message</label>
                <textarea id="message" name="message" rows="5"></textarea>
            </div>

            <button type="submit">Send message</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Ubuntu Tech Solutions.</p>
    </footer>
</body>
</html>
