<!DOCTYPE html>
<html lang="en-ZA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join the Library | Mzansi Community Library</title>
    <meta name="description" content="Apply for membership at Mzansi Community Library using our accessible membership form.">
</head>
<body>
    <header>
        <h1>Join Mzansi Community Library</h1>

        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="events.html">Events</a>
            <a href="join.html">Join the library</a>
        </nav>
    </header>

    <main>
        <h2>Membership application</h2>
        <p>Complete the form below to express your interest in joining.</p>

        <form action="#" method="post">
            <div>
                <label for="full-name">Full name (required)</label>
                <input type="text" id="full-name" name="full-name"
                       autocomplete="name" required>
            </div>

            <div>
                <label for="email">Email address (required)</label>
                <input type="email" id="email" name="email"
                       autocomplete="email" required>
            </div>

            <div>
                <label for="phone">Phone number</label>
                <input type="tel" id="phone" name="phone"
                       autocomplete="tel" aria-describedby="phone-hint">
                <p id="phone-hint">Enter your phone number, including your area code.</p>
            </div>

            <fieldset>
                <legend>Membership type</legend>

                <input type="radio" id="adult" name="membership" value="adult">
                <label for="adult">Adult</label>

                <input type="radio" id="student" name="membership" value="student">
                <label for="student">Student</label>

                <input type="radio" id="child" name="membership" value="child">
                <label for="child">Child</label>
            </fieldset>

            <div>
                <label for="message">Additional message</label>
                <textarea id="message" name="message" rows="5"></textarea>
            </div>

            <button type="submit">Submit application</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Mzansi Community Library.</p>
    </footer>
</body>
</html>
